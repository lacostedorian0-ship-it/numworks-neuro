name: Build GEO DASH N0120
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install official NumWorks toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Build NWA
        run: make build
      - name: Verify generated NWA
        run: test -s target/GEO_DASH.nwa
      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: GEO-DASH-N0120-NWA
          path: target/GEO_DASH.nwa
          if-no-files-found: error
