name: Build GEO DASH N0120
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compiler
        run: |
          make clean
          make build
      - uses: actions/upload-artifact@v4
        with:
          name: GEO-DASH-N0120-NWA
          path: target/GEO_DASH.nwa
          if-no-files-found: error