name: Build GEO DASH N0120
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer la toolchain officielle NumWorks
        uses: numworks/setup-arm-toolchain@latest
      - name: Vérifier le SDK EADK
        run: npx --yes --package=nwlink@1.0.0 -- nwlink eadk-cflags
      - name: Compiler le fichier NWA
        run: |
          make clean
          make build
      - uses: actions/upload-artifact@v4
        with:
          name: GEO-DASH-N0120-NWA
          path: target/GEO_DASH.nwa
          if-no-files-found: error
